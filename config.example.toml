# Copy this file to config.toml and edit it. config.toml is git-ignored.
#
# Anything secret can be written as "env:NAME" to read it from an environment
# variable instead of keeping it in this file, for example community = "env:SNMP_COMMUNITY".
# On Windows, "netmapper snmp-setup" can also store it as "dpapi:...": encrypted so only
# the same Windows user on the same PC can use it.

[discovery]
# The networks to map. Hosts outside these are ignored, and neighbour crawling
# never leaves them.
subnets = ["192.168.1.0/24"]

# Off by default. When on, pings one address at a time with a pause between each,
# so it doesn't look like a scan. A /24 at 0.5s takes about two minutes.
ping_sweep = false
ping_interval_seconds = 0.5
ping_timeout_ms = 1000

# Seconds to listen for devices announcing themselves: mDNS (printers, TVs, phones,
# Macs), SSDP/UPnP (media and IoT devices) and LLMNR (Windows PCs looking up names).
# netmapper sends nothing; it only receives what these devices already broadcast, and
# it listens while the rest of discovery runs. 0 turns it off. Windows Firewall may ask
# whether netmapper can receive on the network the first time; allow it on private
# networks or nothing will be heard.
listen_seconds = 0

[snmp]
enabled = true
# Managed switches and routers to start from. The core switch and the router are a
# good start; others are found through LLDP/CDP if crawl_neighbors is on.
seeds = ["192.168.1.1", "192.168.1.2"]
crawl_neighbors = true
max_devices = 200
timeout_seconds = 2
# Only change this for devices that answer SNMP on a non-standard port.
port = 161
retries = 1

# Off by default. When on, also tries SNMP on every host found in the ARP cache.
# This finds managed switches you didn't list, but an SNMP sweep is exactly the kind of
# thing intrusion detection looks for, so leave it off where that matters.
probe_discovered_hosts = false

# Tried in order on each device until one works. Read-only access is all that's needed.
# "netmapper snmp-setup" adds a block like these for you, after testing it on a switch.
[[snmp.credentials]]
version = "2c"
community = "env:SNMP_COMMUNITY"

# [[snmp.credentials]]
# version = "3"
# username = "netmapper"
# auth_protocol = "sha"        # md5, sha, sha224, sha256, sha384, sha512
# auth_key = "env:SNMP_AUTH"   # at least 8 characters
# priv_protocol = "aes"        # des, 3des, aes, aes192, aes256, aes192c, aes256c
# priv_key = "env:SNMP_PRIV"   # leave out priv_* for authNoPriv
# context = ""                 # SNMPv3 context name; leave empty unless told otherwise
#
# aes192c/aes256c are the Cisco way of deriving AES-192/256 keys (as in Net-SNMP).
# If AES-192/256 fails with a decryption error, try the other variant.

[dhcp]
# Devices that are switched off or quiet are missing from ARP caches and MAC tables,
# but still hold a DHCP lease. Both options are off until you fill them in.
#
# Lease files, relative to this file. Reading them sends nothing. Understood formats:
# dnsmasq (most routers, OpenWrt, Pi-hole), ISC dhcpd.leases (pfSense, Linux), and
# CSV/tab-separated exports with a header row, e.g. from Windows Server:
#   Get-DhcpServerv4Scope | Get-DhcpServerv4Lease | Export-Csv leases.csv
lease_files = []
# Windows DHCP servers to read leases from directly with PowerShell, the same call the
# DHCP console makes. Needs the DhcpServer PowerShell module (part of RSAT) and an
# account in the server's "DHCP Users" group.
windows_servers = []

[topology]
# Look up hostnames with reverse DNS through your normal DNS server. It's off by
# default because it sends one DNS query per host; turn it on for nicer labels.
resolve_names = false
# MAC vendor list. Run "netmapper update-oui" once to download it from the IEEE.
oui_file = "oui.csv"

[diagram]
# Draw a labelled frame round each site, floor or room. Off until you set it up.
#
# Use the location set on each managed switch and router (its SNMP sysLocation, e.g.
# "Floor 2 comms room"). Devices plugged into a switch are drawn in its frame.
group_by_snmp_location = false

# Or say what belongs where. Members can be subnets, IP addresses, or device names and
# MAC addresses with * wildcards. The first matching group wins, and these take priority
# over SNMP locations. Anything not listed joins the group of the switch it plugs into,
# so naming each floor's switches is usually enough.
# [[diagram.groups]]
# name = "Ground floor"
# members = ["gf-sw*"]
#
# [[diagram.groups]]
# name = "First floor"
# members = ["ff-sw*", "192.168.20.0/24"]

[output]
# Each run saves discovery-, topology- and network-<time> files (JSON, .html, .drawio, .vsdx),
# plus *-latest copies of the newest. Relative paths are relative to this file.
directory = "runs"

[alerts]
# Every alert is off until you turn it on here. Then, after each run, netmapper tells
# you if devices appeared ("new"), disappeared ("gone") or moved to a different switch
# port ("moved"). The first run never alerts.
on = ["new"]
# A Windows notification on this PC. Needs someone logged on, so it doesn't work
# with "netmapper schedule --background".
desktop = false

# Email through your mail server. Off unless smtp_host is set.
# [alerts.email]
# smtp_host = "smtp.office365.com"
# smtp_port = 587
# security = "starttls"        # starttls, ssl or none
# username = "alerts@example.com"
# password = "env:NETMAPPER_SMTP_PASSWORD"
# from = "alerts@example.com"
# to = ["it@example.com"]

# POST to a webhook: Teams (a Workflows webhook), Slack, Discord, or plain JSON for
# anything else. Off unless url is set. The URL is a secret, so env: works here too.
# [alerts.webhook]
# url = "env:NETMAPPER_WEBHOOK"
# format = "teams"             # json, teams, slack or discord
