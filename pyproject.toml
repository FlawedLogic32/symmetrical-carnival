[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netmapper"
version = "0.2.0"
description = "Quiet, re-runnable network discovery that feeds an automatic network diagram"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
# cryptography is what pysnmp uses for SNMPv3 encryption (AES/DES).
dependencies = ["pysnmp>=7.1,<8", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netmapper = "netmapper.cli:main"

[tool.setuptools.packages.find]
include = ["netmapper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
